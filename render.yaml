services:
  - type: web
    name: docuflux-backend
    env: docker
    plan: free
    branch: main
    repo: https://github.com/shadab1010/DocuFlux # Note: User needs to ensure this matches their repo
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "False"
      - key: PORT
        value: "5000"
